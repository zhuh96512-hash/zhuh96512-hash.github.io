<script>

    const rows=[grid(0),grid(1),grid(2)];curve(0,f,'#32d6ff');label(0,'① 真实信号',`${f.toFixed(1)} Hz`,'#32d6ff');
    const samplePts=[];for(let n=0;n<=Math.ceil(fs);n++){const t=n/fs;if(t>1+eps)break;samplePts.push({t,x:left+t*W,y:rows[1].mid-Math.sin(2*Math.PI*f*t)*rowH*.32})}ctx.strokeStyle='#a88cff';ctx.lineWidth=2.5*d;ctx.setLineDash([8*d,4*d]);ctx.beginPath();if(samplePts.length){ctx.moveTo(samplePts[0].x,samplePts[0].y);for(let i=0;i<samplePts.length-1;i++){const p0=samplePts[Math.max(0,i-1)],p1=samplePts[i],p2=samplePts[i+1],p3=samplePts[Math.min(samplePts.length-1,i+2)],tension=.78,cp1x=p1.x+(p2.x-p0.x)*tension/6,cp1y=p1.y+(p2.y-p0.y)*tension/6,cp2x=p2.x-(p3.x-p1.x)*tension/6,cp2y=p2.y-(p3.y-p1.y)*tension/6;ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,p2.x,p2.y)}}ctx.stroke();ctx.setLineDash([]);samplePts.forEach(p=>{ctx.strokeStyle='#ffd25a33';ctx.lineWidth=1*d;ctx.beginPath();ctx.moveTo(p.x,rows[1].y0);ctx.lineTo(p.x,rows[1].y0+rowH);ctx.stroke();ctx.fillStyle='#ffd25a';ctx.strokeStyle='#07111d';ctx.lineWidth=2*d;ctx.beginPath();ctx.arc(p.x,p.y,4.8*d,0,Math.PI*2);ctx.fill();ctx.stroke()});label(1,'② 采样与拟合',`${fs.toFixed(1)} 次/秒`,'#ffd25a');
    const resultColor=safe?'#56e39f':boundary?'#ffd25a':'#ff7185';curve(2,af,resultColor,boundary?[5,4]:[]);label(2,'③ 混叠 / 识别结果',safe?`识别为 ${f.toFixed(1)} Hz`:boundary?'理论临界':`误判为 ${alias.toFixed(1)} Hz`,resultColor);
    ctx.fillStyle='#70879f';ctx.font=`${11*d}px Microsoft YaHei`;ctx.textAlign='left';ctx.fillText('0 秒',left,h-11*d);ctx.textAlign='center';ctx.fillText('0.5 秒',left+W/2,h-11*d);ctx.textAlign='right';ctx.fillText('1 秒',left+W,h-11*d);
    $('#signalHzV').textContent=f.toFixed(1);$('#waveSampleHzV').textContent=fs.toFixed(1);$$('.wave-preset').forEach(b=>{const active=Math.abs(+b.dataset.f-f)<.05&&Math.abs(+b.dataset.fs-fs)<.05;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});const box=$('#theoremInsight'),ratio=fs/f;if(safe){box.style.borderColor='var(--green)';box.innerHTML=`<b>可以唯一恢复：</b> f<sub>s</sub> / f<sub>max</sub> = ${ratio.toFixed(2)}，高于 2。第二行紫色虚线是依据离散点得到的样条拟合；理想带限重建则可以恢复第一行真实信号。`}else if(boundary){box.style.borderColor='var(--yellow)';box.innerHTML=`<b>正好处在理论边界：</b> f<sub>s</sub> = 2f<sub>max</sub>。这个正弦示例的采样点可能全部落在零点上，因此实际系统必须留出安全裕量。`}else{box.style.borderColor='var(--red)';box.innerHTML=`<b>发生混叠：</b> 第二行紫色虚线是由黄色采样点得到的样条拟合；第三行红线则由混叠频率 ${alias.toFixed(1)} Hz 直接计算。它们可能接近，但含义不同；真正关键的是红线与第一行 ${f.toFixed(1)} Hz 信号在所有采样时刻取值相同。`}}
  function bindRange(id,key,cb){$(id).addEventListener('input',e=>{state[key]=+e.target.value;cb()})}
bindRange('#signalHz','signalHz',drawWave);bindRange('#waveSampleHz','waveSampleHz',drawWave);
  $$('.wave-preset').forEach(b=>b.addEventListener('click',()=>{state.signalHz=+b.dataset.f;state.waveSampleHz=+b.dataset.fs;$('#signalHz').value=state.signalHz;$('#waveSampleHz').value=state.waveSampleHz;drawWave()}));
drawWave();window.addEventListener('resize',drawWave);
</script>
